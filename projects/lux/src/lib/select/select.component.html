<div class="lux-select">
  <ul class="list">
    @for (item of value; track i; let i = $index) {
    <li>
      <span>{{ item }}</span>
      @if (!disabled) {
      <button
        class="remove"
        type="button"
        (click)="remove(i)"
        [attr.aria-label]="'Remove ' + item"
      >
        Remove
      </button>
      }
    </li>
    }
  </ul>
  @if (!disabled) {
  <div class="add-new-item">
    <lux-input
      id="{{ id + 'addNew' }}"
      type="string"
      [placeholder]="placeholder"
      [attr.aria-label]="placeholder"
      [disabled]="disabled"
      [(value)]="newEntry"
      (keyPress)="onKeyPress($event)"
      (valueChange)="onChangeNewEntry($event)"
    >
    </lux-input>
    @if (canAdd) {
    <div>
      @if (isValidNewEntry) {
      <button type="button" (click)="add(newEntry)">Add</button>
      }
    </div>
    }
    <div class="error">
      {{ error }}
    </div>
  </div>
  }
</div>
