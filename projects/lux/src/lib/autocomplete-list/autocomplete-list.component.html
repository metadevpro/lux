<div [id]="inputId">
  <ul>
    @for (label of labels; track label; let index = $index) {
      <li>
        <span>{{ label }}</span>
        @if (!disabled) {
          <button
            class="remove-item"
            (click)="removeAt(index)"
            attr.aria-label="{{ getDeleteMessage(label) }}"
          ></button>
        }
      </li>
    }
  </ul>
  @if (!disabled) {
    <div class="new-entry">
      <lux-autocomplete
        #auto
        [dataSource]="internalDataSource"
        [placeholder]="placeholder ?? literals[lang].placeholder"
        [(value)]="newEntry"
        (valueChange)="onValueChange()"
        (keypress)="onNewEntryChange($event, auto)"
      >
      </lux-autocomplete>
      @if (canAdd) {
        <button
          type="button"
          class="add-item"
          aria-label="addMessage ?? literals[lang].addMessage"
          (click)="addNew(auto)"
        ></button>
      }
    </div>
  }
</div>
