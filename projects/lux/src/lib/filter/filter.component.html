<div class="filter">
  <input
    #i0
    type="text"
    [attr.aria-label]="ariaLabel"
    [placeholder]="placeholder"
    [id]="inputId"
    [disabled]="disabled"
    [value]="searchValue"
    (valueChange)="onInputValueChange(i0.value)"
    (keyup)="keyup($event, i0.value)"
  />

  <button
    [class.hide]="!searchValue"
    aria-label="Clear"
    class="clear-indicator icon icon-clear"
    type="button"
    (click)="clear()"
  ></button>
  @if (searchOnType) {
    <i class="search-indicator icon icon-search"></i>
  }
  @if (!searchOnType) {
    <button
      class="btn-search"
      type="button"
      [disabled]="disabled"
      (click)="search()"
    >
      Search
    </button>
  }
</div>
